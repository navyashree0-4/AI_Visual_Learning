<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Student learning with headphones and laptop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9b8ff"/><stop offset="1" stop-color="#8f6df5"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b63ee"/><stop offset="1" stop-color="#6a3fd6"/></linearGradient>
    <linearGradient id="bulb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a8"/><stop offset="1" stop-color="#ffb52e"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff6b8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6b8" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4b2bb0" flood-opacity=".25"/></filter>
  </defs>
  <!-- background blobs -->
  <path d="M60 380C40 250 150 150 300 150c120 0 170 60 290 40 120-20 200 70 190 200-10 120-120 190-260 200-170 12-240-10-320-60C110 490 70 450 60 380Z" fill="url(#bg)" opacity=".55"/>
  <ellipse cx="420" cy="590" rx="330" ry="34" fill="#a98bff" opacity=".35"/>
  <!-- bulb -->
  <circle cx="200" cy="120" r="90" fill="url(#glow)"/>
  <path d="M200 50c-38 0-62 28-62 60 0 24 12 38 24 52 8 9 10 18 10 28h56c0-10 2-19 10-28 12-14 24-28 24-52 0-32-24-60-62-60Z" fill="url(#bulb)" filter="url(#sh)"/>
  <path d="M178 100c10 14 12 26 22 26s12-12 22-26" fill="none" stroke="#e08a00" stroke-width="5" stroke-linecap="round"/>
  <rect x="172" y="190" width="56" height="12" rx="6" fill="#8b63ee"/><rect x="178" y="204" width="44" height="12" rx="6" fill="#6a3fd6"/>
  <g stroke="#ffc83d" stroke-width="5" stroke-linecap="round"><path d="M200 8v-0M110 34l14 14M290 34l-14 14M80 100h16M304 100h16"/></g>
  <!-- open book -->
  <g transform="translate(330 60) rotate(-12)" filter="url(#sh)">
    <path d="M0 20l80-12 80 12v90l-80-12-80 12Z" fill="#ffe9e0" stroke="#8b63ee" stroke-width="6" stroke-linejoin="round"/>
    <path d="M80 8v90" stroke="#8b63ee" stroke-width="5"/>
    <g stroke="#e7a9a0" stroke-width="4" stroke-linecap="round"><path d="M18 44h46M18 58h46M18 72h46M96 44h46M96 58h46"/></g>
  </g>
  <!-- clapperboard -->
  <g transform="translate(560 70) rotate(8)" filter="url(#sh)">
    <rect x="0" y="34" width="130" height="92" rx="10" fill="#5a3dbb"/>
    <path d="M0 34l10-30 130 10-10 30Z" fill="#3b2a86"/>
    <g fill="#fff"><path d="M18 8l22 2-8 22-22-2ZM56 12l22 2-8 22-22-2ZM94 16l22 2-8 22-22-2Z"/></g>
    <path d="M52 62l40 22-40 22Z" fill="#fff"/>
  </g>
  <!-- speech bubble -->
  <g transform="translate(640 200) rotate(-8)" filter="url(#sh)">
    <path d="M0 14a14 14 0 0 1 14-14h110a14 14 0 0 1 14 14v56a14 14 0 0 1-14 14H40L14 104V84A14 14 0 0 1 0 70Z" fill="#fff"/>
    <text x="69" y="36" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="20" fill="#2a1f5e">Learn at</text>
    <text x="69" y="62" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="20" fill="#2a1f5e">Your Pace</text>
  </g>
  <!-- floating cards -->
  <g transform="translate(640 330) rotate(18)" filter="url(#sh)"><rect width="120" height="100" rx="14" fill="#a98bff"/><rect x="14" y="14" width="40" height="40" rx="8" fill="#ffb347"/><rect x="62" y="24" width="44" height="10" rx="5" fill="#fff"/><rect x="62" y="44" width="36" height="10" rx="5" fill="#e4dbff"/></g>
  <!-- learning card -->
  <g transform="translate(95 215) rotate(-9)" filter="url(#sh)">
    <rect width="230" height="130" rx="20" fill="#fff"/>
    <circle cx="30" cy="34" r="9" fill="#1fbf75"/>
    <text x="52" y="32" font-family="Poppins,Arial,sans-serif" font-weight="700" font-size="20" fill="#2a1f5e">EduVision</text>
    <text x="52" y="56" font-family="Poppins,Arial,sans-serif" font-weight="500" font-size="18" fill="#2a1f5e">Learning Space</text>
    <text x="22" y="98" font-family="Poppins,Arial,sans-serif" font-weight="600" font-size="18" fill="#2a1f5e">Let's Learn</text>
    <rect x="22" y="108" width="186" height="10" rx="5" fill="#e9e5fb"/><rect x="22" y="108" width="80" height="10" rx="5" fill="#2f8bff"/>
  </g>
  <!-- plant -->
  <g transform="translate(90 440)"><path d="M30 30c-22-4-30-26-22-44 20 4 28 22 22 44ZM34 30c4-24 22-34 34-30-2 22-16 32-34 30Z" fill="#6ad08a"/><path d="M10 34h56l-8 52H18Z" fill="#8b63ee"/></g>
  <!-- girl: hair back -->
  <path d="M420 250c-40 10-60 60-52 120 6 50 30 70 60 80l150-10c20-50 20-120-10-170-30-40-100-50-148-20Z" fill="#7a3f2b"/>
  <path d="M560 270c40 10 60 60 40 130-10 30-30 40-40 40l-30-60Z" fill="#6b3524"/>
  <!-- hoodie -->
  <path d="M330 640c-10-90 30-170 110-190l120 6c80 20 120 90 110 184Z" fill="url(#hood)"/>
  <path d="M470 456c-6 30-6 60 0 100M520 456c6 30 6 60 0 100" stroke="#e9e3ff" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- neck + face -->
  <rect x="455" y="390" width="52" height="60" rx="22" fill="#f6c4a4"/>
  <ellipse cx="480" cy="330" rx="88" ry="96" fill="#fbd3b5"/>
  <!-- bangs -->
  <path d="M390 320c-4-60 30-100 92-100 56 0 92 36 88 96-30-10-60-40-76-70-14 30-60 60-104 74Z" fill="#8a4a33"/>
  <!-- eyes -->
  <g><ellipse cx="445" cy="335" rx="16" ry="20" fill="#3a2418"/><ellipse cx="518" cy="335" rx="16" ry="20" fill="#3a2418"/>
  <circle cx="450" cy="328" r="6" fill="#fff"/><circle cx="523" cy="328" r="6" fill="#fff"/><circle cx="440" cy="342" r="3" fill="#fff"/><circle cx="513" cy="342" r="3" fill="#fff"/></g>
  <g fill="#ff9aa2" opacity=".6"><ellipse cx="418" cy="372" rx="16" ry="9"/><ellipse cx="548" cy="372" rx="16" ry="9"/></g>
  <path d="M452 380c10 22 40 22 52 0Z" fill="#fff" stroke="#a5412f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M430 300c10-8 22-8 32 0M500 300c10-8 22-8 32 0" stroke="#5a3321" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- headphones -->
  <path d="M388 330c-12-100 40-150 100-150s108 52 96 150" fill="none" stroke="#6a45d8" stroke-width="16" stroke-linecap="round"/>
  <rect x="368" y="310" width="42" height="84" rx="20" fill="#7c58ea" stroke="#5b3bc4" stroke-width="5"/>
  <rect x="562" y="310" width="42" height="84" rx="20" fill="#7c58ea" stroke="#5b3bc4" stroke-width="5"/>
  <!-- pointing hand -->
  <g transform="translate(345 330) rotate(-20)"><rect x="0" y="40" width="46" height="60" rx="18" fill="#fbd3b5"/><rect x="18" y="-20" width="16" height="70" rx="8" fill="#fbd3b5"/></g>
  <!-- laptop -->
  <g filter="url(#sh)">
    <path d="M300 470l50-140 190 6 36 160-40 6Z" fill="#7a66a8"/>
    <path d="M318 462l40-120 170 6 30 130Z" fill="#8f7cc0"/>
    <path d="M425 400l30-14 30 14-30 14Z M440 408v14c10 8 28 8 38 0v-14" fill="#fff" opacity=".85"/>
    <path d="M290 500h300l30 24H270Z" fill="#6a5a96"/>
  </g>
  <!-- hands on keyboard -->
  <ellipse cx="540" cy="510" rx="40" ry="16" fill="#fbd3b5"/>
  <!-- sparkles -->
  <g fill="#fff"><path d="M660 120l6 16 16 6-16 6-6 16-6-16-16-6 16-6Z"/><path d="M60 300l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/><path d="M730 440l5 12 12 5-12 5-5 12-5-12-12-5 12-5Z"/></g>
</svg>