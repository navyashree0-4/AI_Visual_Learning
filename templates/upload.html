<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Material | EduVision</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    <style>

        .upload-page {
            max-width: 700px;
            margin: 50px auto;
        }

        .upload-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            border: 1px solid #e7eaf1;
            box-shadow: 0 15px 40px rgba(30, 40, 70, 0.10);
        }

        .upload-card h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .upload-card p {
            color: #7d8798;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .file-box {
            border: 2px dashed #cfd5e2;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            margin-bottom: 20px;
        }

        .file-box input {
            margin-top: 15px;
        }

        .upload-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #315bea,
                #7048e8
            );

            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-btn:hover {
            opacity: 0.9;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #315bea;
            text-decoration: none;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <main class="upload-page">

        <div class="upload-card">

            <h2>Upload Study Material</h2>

            <p>
                Upload your study material to use it
                for visual learning.
            </p>

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    <div class="flash-message">

                        {% for message in messages %}

                            {{ message }}

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}


            <form method="POST"
                  action="{{ url_for('upload') }}"
                  enctype="multipart/form-data">

                <div class="file-box">

                    <strong>
                        Select your study material
                    </strong>

                    <br>

                    <small>
                        PDF or TXT files
                    </small>

                    <br>

                    <input
                        type="file"
                        name="file"
                        accept=".pdf,.txt"
                        required>

                </div>


                <button
                    type="submit"
                    class="upload-btn">

                    Upload Material

                </button>

            </form>


            <a href="{{ url_for('dashboard') }}"
               class="back-btn">

                ← Back to Dashboard

            </a>

        </div>

    </main>

</body>

</html>
