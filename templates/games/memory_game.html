<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduVision - Memory Cards</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

.navbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #4f46e5;
}

.back {
    text-decoration: none;
    color: #4f46e5;
    font-weight: bold;
}

.container {
    width: 90%;
    max-width: 700px;
    margin: 40px auto;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    text-align: center;
}

.icon {
    font-size: 55px;
}

.subtitle {
    color: #6b7280;
    margin: 10px 0 20px;
}

.score {
    display: inline-block;
    background: #fff7d6;
    color: #8a6200;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 25px;
}

.board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.card-item {
    height: 100px;
    border-radius: 12px;
    background: #4f46e5;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    cursor: pointer;
}

.card-item.open {
    background: #eef2ff;
    color: #4f46e5;
}

.card-item.matched {
    background: #dcfce7;
    color: #166534;
    cursor: default;
}

.message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    display: none;
    font-weight: bold;
}

.home {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 20px;
    background: #111827;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

@media(max-width:600px) {
    .board {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">EduVision</div>

    <a href="{{ url_for('dashboard') }}" class="back">
        ← Dashboard
    </a>

</nav>

<div class="container">

<div class="card">

    <div class="icon">🃏</div>

    <h1>Memory Cards</h1>

    <p class="subtitle">
        Find matching educational pairs.
    </p>

    <div class="score">
        ⭐ Score: <span id="score">0</span>
    </div>

    <div class="board" id="board"></div>

    <div class="message" id="message"></div>

    <a href="{{ url_for('dashboard') }}" class="home">
        Back to Dashboard
    </a>

</div>

</div>

<script>

const symbols = [
    "📚", "📚",
    "💻", "💻",
    "🧠", "🧠",
    "🔬", "🔬",
    "🌱", "🌱",
    "🤖", "🤖"
];

let shuffled = [...symbols].sort(() => Math.random() - 0.5);

let first = null;
let second = null;
let lock = false;
let matches = 0;
let score = 0;

const board =
    document.getElementById("board");

shuffled.forEach(symbol => {

    const card =
        document.createElement("div");

    card.className = "card-item";

    card.textContent = "❔";

    card.dataset.symbol = symbol;

    card.onclick = () => flip(card);

    board.appendChild(card);
});

function flip(card) {

    if (
        lock ||
        card.classList.contains("open") ||
        card.classList.contains("matched")
    ) {
        return;
    }

    card.classList.add("open");

    card.textContent =
        card.dataset.symbol;

    if (!first) {

        first = card;
        return;
    }

    second = card;

    if (
        first.dataset.symbol ===
        second.dataset.symbol
    ) {

        first.classList.add("matched");
        second.classList.add("matched");

        score += 2;
        matches++;

        document.getElementById("score")
            .textContent = score;

        first = null;
        second = null;

        if (matches === symbols.length / 2) {

            const message =
                document.getElementById("message");

            message.textContent =
                "🎉 Excellent! You found all pairs! +10 Completion Credits";

            message.style.display = "block";
            message.style.background = "#dcfce7";
            message.style.color = "#166534";
        }

    } else {

        lock = true;

        setTimeout(() => {

            first.classList.remove("open");
            second.classList.remove("open");

            first.textContent = "❔";
            second.textContent = "❔";

            first = null;
            second = null;

            lock = false;

        }, 800);
    }

}

</script>

</body>
</html>
