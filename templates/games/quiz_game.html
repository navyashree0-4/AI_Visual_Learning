<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVision - Quiz Challenge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #4f46e5;
        }

        .back {
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .heading {
            text-align: center;
        }

        .icon {
            font-size: 55px;
        }

        h1 {
            margin: 10px 0;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .score {
            text-align: center;
            background: #fff7d6;
            color: #8a6200;
            padding: 10px;
            border-radius: 20px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .option {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f9fafb;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }

        .option:hover {
            background: #eef2ff;
            border-color: #4f46e5;
        }

        .next {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
        }

        .finished {
            display: none;
            text-align: center;
            margin-top: 25px;
            padding: 25px;
            background: #f0fdf4;
            border-radius: 15px;
        }

        .home {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">EduVision</div>

    <a href="{{ url_for('dashboard') }}" class="back">
        ← Dashboard
    </a>
</nav>

<div class="container">

    <div class="card">

        <div class="heading">
            <div class="icon">🧠</div>

            <h1>Quiz Challenge</h1>

            <p class="subtitle">
                Answer the questions and test what you know.
            </p>
        </div>

        <div class="score">
            ⭐ Score: <span id="score">0</span>
        </div>

        <div id="game">

            <div class="question" id="question"></div>

            <div id="options"></div>

            <div class="message" id="message"></div>

            <button class="next" id="next" onclick="nextQuestion()">
                Next Question →
            </button>

        </div>

        <div class="finished" id="finished">

            <h2>🎉 Quiz Completed!</h2>

            <p id="final"></p>

            <p style="margin-top:10px;">
                ⭐ Great job! Keep learning.
            </p>

            <a href="{{ url_for('dashboard') }}" class="home">
                Back to Dashboard
            </a>

        </div>

    </div>

</div>

<script>

const quiz = [
    {
        question: "Which language is mainly used to structure web pages?",
        options: ["Python", "HTML", "Java", "SQL"],
        answer: "HTML"
    },
    {
        question: "Which database is commonly used with Flask applications?",
        options: ["MySQL", "Photoshop", "PowerPoint", "Excel"],
        answer: "MySQL"
    },
    {
        question: "Which technology is used to style web pages?",
        options: ["CSS", "Python", "SQL", "Java"],
        answer: "CSS"
    },
    {
        question: "What does AI stand for?",
        options: [
            "Automatic Internet",
            "Artificial Intelligence",
            "Advanced Input",
            "Application Interface"
        ],
        answer: "Artificial Intelligence"
    },
    {
        question: "Which of these is a programming language?",
        options: ["HTML", "CSS", "Python", "HTTP"],
        answer: "Python"
    }
];

let current = 0;
let score = 0;
let answered = false;

function loadQuestion() {

    answered = false;

    const q = quiz[current];

    document.getElementById("question").textContent =
        (current + 1) + ". " + q.question;

    const options = document.getElementById("options");

    options.innerHTML = "";

    q.options.forEach(option => {

        const button = document.createElement("button");

        button.className = "option";
        button.textContent = option;

        button.onclick = () => checkAnswer(option);

        options.appendChild(button);
    });

    document.getElementById("message").style.display = "none";
    document.getElementById("next").style.display = "none";
}

function checkAnswer(option) {

    if (answered) return;

    answered = true;

    const message = document.getElementById("message");

    if (option === quiz[current].answer) {

        score += 2;

        message.textContent = "✓ Correct! +2 Credits";
        message.style.background = "#dcfce7";
        message.style.color = "#166534";

    } else {

        message.textContent =
            "✗ Incorrect. Correct answer: " + quiz[current].answer;

        message.style.background = "#fee2e2";
        message.style.color = "#991b1b";
    }

    document.getElementById("score").textContent = score;

    message.style.display = "block";

    if (current < quiz.length - 1) {

        document.getElementById("next").style.display = "block";

    } else {

        setTimeout(finish, 700);
    }
}

function nextQuestion() {

    current++;

    loadQuestion();
}

function finish() {

    document.getElementById("game").style.display = "none";

    document.getElementById("finished").style.display = "block";

    document.getElementById("final").textContent =
        "Your final score is " + score + " credits.";
}

loadQuestion();

</script>

</body>
</html>
