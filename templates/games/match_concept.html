<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduVision - Match the Concept</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

.navbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #4f46e5;
}

.back {
    text-decoration: none;
    color: #4f46e5;
    font-weight: bold;
}

.container {
    width: 90%;
    max-width: 850px;
    margin: 40px auto;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    text-align: center;
}

.icon {
    font-size: 55px;
}

.subtitle {
    color: #6b7280;
    margin: 10px 0 25px;
}

.score {
    display: inline-block;
    background: #fff7d6;
    color: #8a6200;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    text-align: left;
}

.column h3 {
    margin-bottom: 12px;
}

.item {
    padding: 15px;
    background: #f9fafb;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
}

.item:hover {
    background: #eef2ff;
}

.selected {
    border-color: #4f46e5;
    background: #eef2ff;
}

.matched {
    background: #dcfce7;
    border-color: #22c55e;
    pointer-events: none;
}

.message {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    display: none;
    font-weight: bold;
}

.reset {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    background: #4f46e5;
    color: white;
    border-radius: 9px;
    cursor: pointer;
}

.home {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    background: #111827;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

@media(max-width:650px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">EduVision</div>
    <a href="{{ url_for('dashboard') }}" class="back">← Dashboard</a>
</nav>

<div class="container">

<div class="card">

    <div class="icon">🔗</div>

    <h1>Match the Concept</h1>

    <p class="subtitle">
        Match each concept with its correct meaning.
    </p>

    <div class="score">
        ⭐ Score: <span id="score">0</span>
    </div>

    <div class="grid">

        <div class="column">
            <h3>Concepts</h3>

            <div class="item" data-value="html">HTML</div>
            <div class="item" data-value="css">CSS</div>
            <div class="item" data-value="python">Python</div>
            <div class="item" data-value="database">Database</div>
        </div>

        <div class="column">
            <h3>Meanings</h3>

            <div class="item" data-value="database">
                Stores and manages data
            </div>

            <div class="item" data-value="python">
                Programming language
            </div>

            <div class="item" data-value="html">
                Structures web pages
            </div>

            <div class="item" data-value="css">
                Styles web pages
            </div>
        </div>

    </div>

    <div class="message" id="message"></div>

    <button class="reset" onclick="resetGame()">
        Restart Game
    </button>

    <br>

    <a href="{{ url_for('dashboard') }}" class="home">
        Back to Dashboard
    </a>

</div>

</div>

<script>

let first = null;
let score = 0;
let matches = 0;

const items = document.querySelectorAll(".item");

items.forEach(item => {

    item.addEventListener("click", function() {

        if (this.classList.contains("matched")) return;

        if (!first) {

            first = this;

            this.classList.add("selected");

        } else {

            const second = this;

            if (first === second) return;

            if (first.dataset.value === second.dataset.value) {

                first.classList.remove("selected");
                first.classList.add("matched");

                second.classList.add("matched");

                score += 2;
                matches++;

                document.getElementById("score").textContent = score;

                if (matches === 4) {

                    const message =
                        document.getElementById("message");

                    message.textContent =
                        "🎉 Excellent! All concepts matched. +10 Completion Credits";

                    message.style.display = "block";
                    message.style.background = "#dcfce7";
                    message.style.color = "#166534";
                }

            } else {

                first.classList.remove("selected");

                const message =
                    document.getElementById("message");

                message.textContent =
                    "Try again! Those concepts do not match.";

                message.style.display = "block";
                message.style.background = "#fee2e2";
                message.style.color = "#991b1b";

            }

            first = null;
        }

    });

});

function resetGame() {

    location.reload();

}

</script>

</body>
</html>
